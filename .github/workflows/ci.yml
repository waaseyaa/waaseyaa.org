name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --optimize-autoloader

      - name: Composer validate
        run: composer validate --no-check-publish

      - name: PHPUnit
        run: composer test

      - name: chmod bins
        run: chmod +x bin/waaseyaa-version bin/waaseyaa-audit-site bin/verify-deploy-rsync

      - name: Audit site preflight
        run: ./bin/waaseyaa-audit-site
