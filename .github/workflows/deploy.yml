name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout waaseyaa.org
        uses: actions/checkout@v4
        with:
          path: waaseyaa-org

      - name: Checkout waaseyaa framework
        uses: actions/checkout@v4
        with:
          repository: waaseyaa/framework
          ref: main
          path: waaseyaa

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml
          coverage: none

      - name: Install Composer dependencies
        working-directory: waaseyaa-org
        run: |
          composer install \
            --no-dev \
            --no-interaction \
            --optimize-autoloader \
            --prefer-dist

      - name: Assemble build artifact
        run: |
          mkdir -p waaseyaa-org/.build
          rsync -aL \
            --exclude='.git' \
            --exclude='.build/' \
            --exclude='tests/' \
            --exclude='/docs/' \
            --exclude='.env' \
            --exclude='storage/framework/packages.php' \
            --exclude='deploy.php' \
            --exclude='ops/' \
            waaseyaa-org/ waaseyaa-org/.build/
          # Root docs/ is excluded (anchored /docs/) so templates/docs/ Twig files
          # still copy. Re-add docs/guides only — omit audits, superpowers, etc.
          mkdir -p waaseyaa-org/.build/docs/guides
          rsync -aL waaseyaa-org/docs/guides/ waaseyaa-org/.build/docs/guides/

      - name: Install PHP Deployer
        run: composer global require deployer/deployer --no-interaction

      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add known host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan waaseyaa.org >> ~/.ssh/known_hosts

      - name: Deploy
        working-directory: waaseyaa-org
        run: dep deploy production --no-interaction
        env:
          GITHUB_TOKEN: ${{ secrets.DOCS_GITHUB_TOKEN }}
